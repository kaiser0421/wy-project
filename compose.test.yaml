# Test stack: same PostgreSQL image and configuration as production (fsync on).
# Run the backend and frontend suites with make test.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    tmpfs: [/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    environment:
      APP_ENV: test
      TEST_ADMIN_DATABASE_URL: postgresql://test:test@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/${TEST_REDIS_DB:-0}
      TEST_TEMPLATE_DB: ${TEST_TEMPLATE_DB:-ticketing_template}
      ENABLE_TEST_HOOKS: "true"
    command:
      - sh
      - -ec
      - |
        ruff check backend paymock
        ruff format --check backend paymock
        mypy backend/src paymock/src
        lint-imports
        pytest -q -p no:cacheprovider backend/tests
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend-tests:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /frontend
    init: true
    volumes:
      - ./frontend:/source:ro
    environment:
      CI: "true"
    command:
      - sh
      - -ec
      - |
        tar -C /source --exclude='./node_modules' --exclude='./.npm-cache' --exclude='./dist' \
          --exclude='./coverage' --exclude='./playwright-report' --exclude='./test-results' -cf - . | tar -xf -
        npm ci
        npm run lint
        npm run typecheck
        npm run build
        npm run test:coverage
        npm run test:e2e
