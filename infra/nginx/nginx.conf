worker_processes auto;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # Docker's embedded DNS; re-resolve replicas every 5 s so recreated containers get traffic.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # One clock for edge metrics: $msec is nginx's own time.
    log_format edge_json escape=json '{'
        '"ts":"$msec",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"req_ms":"$request_time",'
        '"upstream_ms":"$upstream_response_time",'
        '"upstream":"$upstream_addr",'
        '"bytes":$bytes_sent,'
        '"load_run":"$http_x_load_run_id",'
        '"ua":"$http_user_agent"'
    '}';

    upstream api {
        zone api_upstream 64k;
        least_conn;
        server api:8000 resolve;
        keepalive 256;
    }

    upstream paymock {
        zone paymock_upstream 64k;
        server paymock:8000 resolve;
        keepalive 32;
    }

    server {
        listen 8080;

        access_log /data/logs/nginx-access.json edge_json;
        access_log /dev/stdout edge_json;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Always overwrite any client-supplied value.
        proxy_set_header X-Request-ID $request_id;
        # Trace parent links are internal only; never accept them from the public.
        proxy_set_header X-Parent-Op "";
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        # The API echoes the same id; hide it so clients see exactly one header (also on nginx's own errors).
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;

        location = /healthz/live {
            proxy_pass http://api;
        }

        location /healthz/ {
            return 404;
        }

        location ~ ^/api/v1/events/[0-9]+/(seat-stream)$ {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            # No add_header here: it would cancel inherited X-Request-ID and security headers.
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_read_timeout 60s;
        }

        location /pay/ {
            proxy_pass http://paymock;
        }

        location / {
            return 404;
        }
    }
}
