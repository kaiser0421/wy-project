worker_processes auto;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # Docker's embedded DNS; re-resolve replicas every 5 s so recreated containers get traffic.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Checkout URLs grant access to a payment, including confirm and decline subpaths.
    map $uri $access_log_uri {
        ~^/pay/[^/]+ /pay/:id;
        default $uri;
    }

    # One clock for edge metrics: $msec is nginx's own time.
    log_format edge_json escape=json '{'
        '"ts":"$msec",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$access_log_uri",'
        '"status":$status,'
        '"req_ms":"$request_time",'
        '"upstream_ms":"$upstream_response_time",'
        '"upstream":"$upstream_addr",'
        '"bytes":$bytes_sent,'
        '"load_run":"$http_x_load_run_id",'
        '"ua":"$http_user_agent"'
    '}';

    upstream api {
        zone api_upstream 64k;
        least_conn;
        server api:8000 resolve;
        keepalive 256;
    }

    upstream paymock {
        zone paymock_upstream 64k;
        server paymock:8000 resolve;
        keepalive 32;
    }

    server {
        listen 8080;

        access_log /data/logs/nginx-access.json edge_json;
        access_log /dev/stdout edge_json;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Always overwrite any client-supplied value.
        proxy_set_header X-Request-ID $request_id;
        # Trace parent links are internal only; never accept them from the public.
        proxy_set_header X-Parent-Op "";
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        # The API echoes the same id; hide it so clients see exactly one header (also on nginx's own errors).
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;

        location = /healthz/live {
            proxy_pass http://api;
        }

        location /healthz/ {
            return 404;
        }

        # Connection counts for the collector; internal network only.
        location = /nginx_status {
            stub_status;
            access_log off;
            deny 172.28.0.1;  # docker gateway = traffic from the host port mapping
            allow 172.28.0.0/24;
            allow 127.0.0.1;
            deny all;
        }

        # Admin live metric/alert streams (SSE): no buffering.
        location ~ ^/api/v1/admin/(metrics|alerts)/stream$ {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
        }

        location ~ ^/api/v1/events/[0-9]+/(seat-stream)$ {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            # No add_header here: it would cancel inherited X-Request-ID and security headers.
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_read_timeout 60s;
        }

        # Seat imports: up to 20 MB files (the API enforces the exact limit while streaming).
        location ~ ^/api/v1/events/[0-9]+/seat-imports$ {
            client_max_body_size 21m;
            proxy_request_buffering off;
            proxy_pass http://api;
            proxy_read_timeout 120s;
        }

        # Sales report export can take a while for large events.
        location ~ ^/api/v1/events/[0-9]+/reports/ {
            proxy_pass http://api;
            proxy_read_timeout 300s;
        }

        location /pay/ {
            # Upstream diagnostics include raw checkout URLs. Use the redacted access log for
            # payment-proxy status and timings.
            error_log /dev/null;
            proxy_pass http://paymock;
        }

        # Web UI (static build). Unknown paths fall back to the SPA entry point.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Request-ID $request_id always;
        }
    }
}
