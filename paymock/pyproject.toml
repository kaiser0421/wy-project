[project]
name = "paymock"
version = "0.1.0"
description = "Simulated payment provider (intents, captures, refunds, signed callbacks)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10,<3",
    "httpx>=0.28",
    "orjson>=3.10",
]

[project.scripts]
paymock = "paymock.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paymock"]
