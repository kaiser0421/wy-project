[project]
name = "ticketing"
version = "0.1.0"
description = "Ticketing platform backend: API, workers, outbox relay, telemetry collector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "orjson>=3.10",
    "structlog>=24.4",
    "alembic>=1.14",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
]

[project.scripts]
ticketing-api = "ticketing.api.main:main"
ticketing-worker = "ticketing.worker.main:main"
ticketing-relay = "ticketing.relay.main:main"
ticketing-collector = "ticketing.collector.main:main"
ticketing-seed = "ticketing.seed.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketing"]
