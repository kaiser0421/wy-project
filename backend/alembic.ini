[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
version_path_separator = os
# sqlalchemy.url is taken from DATABASE_URL in migrations/env.py

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
